<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Clicker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="autoClickersContainer" class="auto-clickers-container"></div>

    <div class="game-container">
        <h1>Box Clicker</h1>
        
        <div class="main-game">
            <div class="click-area">
                <div id="clickBox" class="click-box">📦</div>
                <p id="boxCount">Boxes: 0</p>
                <p id="boxesPerSecond">Boxes per second: 0</p>
            </div>
            
            <div class="shop">
                <h2>Shop</h2>
                <div class="upgrade" id="autoClickerUpgrade">
                    <h3>AutoClicker</h3>
                    <p>+1 box per second</p>
                    <p>Cost: <span id="autoClickerCost">10</span> boxes</p>
                    <p>Owned: <span id="autoClickerOwned">0</span></p>
                    <button id="buyAutoClicker">Buy AutoClicker</button>
                </div>
                
                <div class="upgrade" id="factoryUpgrade">
                    <h3>Box Factory</h3>
                    <p>+5 boxes per second</p>
                    <p>Cost: <span id="factoryCost">75</span> boxes</p>
                    <p>Owned: <span id="factoryOwned">0</span></p>
                    <button id="buyFactory">Buy Factory</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    <div id="autoClickersContainer" class="auto-clickers-container"></div>
</body>
</html>

</body>
</html>
